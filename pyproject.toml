[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pic-test-automation-framework"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["core", "analytics", "prototypes"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Only these folders hold tests, so test files parked elsewhere (like Claude outputs/) aren't collected.
testpaths = ["tests", "prototypes/tests"]
